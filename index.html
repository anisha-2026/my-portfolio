
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practice IT knowledge with this interactive quiz.">
  <title>IT Knowledge Quiz</title>
  <link rel="stylesheet" href="styles.css">
  <script src="questions.js" defer></script>
  <script src="quiz.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">LEARN · PRACTICE · IMPROVE</p>
      <h1>IT Knowledge Quiz</h1>
      <p class="subtitle">Test your technical knowledge, one question at a time.</p>
    </header>

    <section id="quiz-screen" class="quiz-card" aria-labelledby="question-text">
      <div class="quiz-meta">
        <span id="progress-text">Question 1 of 8</span>
        <span id="timer-text" role="timer" aria-label="Time remaining">
          30 seconds
        </span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Quiz progress"
        aria-valuemin="0"
        aria-valuemax="8"
        aria-valuenow="0"
        id="progress-bar"
      >
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h2 id="question-text" tabindex="-1">Loading question...</h2>

      <div id="options-container" class="options-list"></div>

      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <div class="quiz-footer">
        <span class="keyboard-hint">Tip: press keys 1–4 to answer</span>
        <button id="next-button" class="primary-button" type="button" hidden>
          Next Question
        </button>
      </div>
    </section>

    <section id="result-screen" class="quiz-card" hidden>
      <p class="eyebrow">QUIZ COMPLETED</p>
      <h2>Your Results</h2>
      <p id="score-text" class="score-text"></p>
      <p id="grade-message" class="grade-message"></p>

      <div class="result-actions">
        <button id="review-button" class="secondary-button" type="button">
          Review Answers
        </button>
        <button id="restart-button" class="primary-button" type="button">
          Restart Quiz
        </button>
      </div>

      <div id="review-container" class="review-list" hidden>
        <h3>Answer Review</h3>
        <div id="review-items"></div>
      </div>
    </section>

    <footer class="app-footer">
      <p>Built with HTML, CSS and JavaScript.</p>
    </footer>
  </main>
</body>
</html>
